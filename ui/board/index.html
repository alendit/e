<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>e-board</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { width: 100%; height: 100%; display: block; background: transparent; opacity: 0; transition: opacity 80ms ease-out; }
    canvas.ready { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="egui-canvas"></canvas>
  <script type="module">
    import init, { start_app, announce_ready, egui_push_state, egui_push_theme } from "./pkg/e_board.js";

    function parseHashParams() {
      const hash = window.location.hash.replace(/^#/, "");
      if (!hash) return null;
      const params = new URLSearchParams(hash);
      return {
        bg: params.get("bg"),
        fg: params.get("fg"),
        fontSize: params.get("font-size") ? Number(params.get("font-size")) : null,
        surfaceBg: params.get("surface-bg") || null,
      };
    }

    function pushTheme(theme) {
      const probe = document.createElement("span");
      document.body.appendChild(probe);
      const color = (value) => {
        if (!value) return value;
        probe.style.color = "";
        probe.style.color = value;
        if (!probe.style.color) return value;
        const match = getComputedStyle(probe).color.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
        return match
          ? `#${match.slice(1).map((part) => Number(part).toString(16).padStart(2, "0")).join("")}`
          : value;
      };
      const normalized = {
        ...theme,
        bg: color(theme.bg),
        fg: color(theme.fg),
        "surface-bg": color(theme["surface-bg"] || theme.bg),
      };
      probe.remove();
      egui_push_theme(JSON.stringify(normalized));
    }

    async function run() {
      const canvas = document.getElementById("egui-canvas");
      await init();
      await start_app("egui-canvas");
      const theme = parseHashParams();
      if (theme && theme.bg && theme.fg) {
        pushTheme({
          bg: theme.bg,
          fg: theme.fg,
          "font-size": theme.fontSize,
          "surface-bg": theme.surfaceBg,
        });
      }
      canvas.classList.add("ready");
      let receivedState = false;
      window.eguiBoardStateReady = false;
      window.eguiPushState = (json) => {
        receivedState = true;
        window.eguiBoardStateReady = true;
        egui_push_state(json);
      };
      window.eguiPushTheme = (json) => pushTheme(JSON.parse(json));
      let retryDelay = 250;
      function requestInitialState() {
        if (receivedState) return;
        announce_ready();
        window.setTimeout(requestInitialState, retryDelay);
        retryDelay = Math.min(retryDelay * 2, 4000);
      }
      requestInitialState();
    }

    run();
  </script>
</body>
</html>
